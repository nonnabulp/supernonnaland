 for(let i=0;i<8;i++){const hx=((i*220-cam*.3)%1800+1800)%1800-150;R(hx,190,150,40,d.hl);R(hx+30,172,90,20,d.hl)}

 for(const s of S){

let mus=null,mute=false,mi=0;
function music(){
 if(mus||mute)return;
 try{
  const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());
  if(a.state==='suspended')a.resume();
  const lead=[0,4,7,12,9,7,4,7,5,9,12,9,7,4,2,4,0,4,7,12,14,12,9,7,5,7,9,7,4,2,0,-1],bass=[0,0,7,7,5,5,7,7],base=261.63;
  let nt=a.currentTime+.1;
  const tone=(f,t0,du,ty,v)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+du);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+du)};
  mus=setInterval(()=>{while(nt<a.currentTime+.4){
   tone(base*Math.pow(2,lead[mi%32]/12),nt,.16,'square',.02);
   if(mi%4==0)tone(base/2*Math.pow(2,bass[(mi/4)%8]/12),nt,.4,'triangle',.045);
   nt+=.17;mi++}},100);
 }catch(err){}
}

MB.onclick=()=>{if(mus){clearInterval(mus);mus=null;mute=true;MB.textContent='MUSIC: OFF'}else{mute=false;MB.textContent='MUSIC: ON';music()}MB.blur()};
